# 实体本体 registry（O1 实体解析 + O4 本体合并）
# 战略实体的稳定身份、别名与富属性档案。事件里的业主字符串解析到这里的 id。
# type: company（终端业主）| oem（装备商）| competitor（在位竞品）| self（ESG 自身）
#
# O4（2026-06-16）：把原孤儿化的两套本体折叠进来，终结双本体——
#   - profile 来源 config/p4_opportunity_map.yml（OEM 档案：关键词/角色/对口阀型/在位竞品/capex 系数）
#   - profile 来源 data/products_analysis.json summary（竞品威胁档：威胁分/产品数/高威胁产品）
# load_registry 把整条 entity dict 按 id 存入 by_id，故 get(id) 自动带出 profile，无需 join 代码。
# p4_opportunity_map.yml 仍由 legacy scripts/p4_opportunities.py 读取，保留不删；实体数据以本文件为准。

entities:

# ESG 事件引擎 · 工况知识库
# 按"工况"而非"行业"组织。每个工况定义：命中关键词、对应阀型、推断买方角色、行业标签。
# capex_ratio：固定资产投资 → 流体系统采购额的经验系数（与 p4_opportunity_map.yml 一致）。

capex_ratio:
  low: 0.005
  high: 0.015
  label: 流体系统机会模型估算，待真实项目复盘校准

value_overrides: []

# 源权重：招标=即时最强信号，募投次之，环评提前量最长但最弱
# 键对齐事件 source.type：capex(募投) / project_filing(环评) / tender(招标)
source_boost:
  tender: 2.0
  capex: 1.0
  project_filing: 0.5
  pipeline: 0.3   # CDE 优先审评：最早的 pipeline 前兆，但最弱

conditions:
  - id: hygienic
    label: 卫生级工艺
    industries: [食品饮料, 食品制造业, 酒饮料精制茶制造业, 泡塑, 饲料]
    keywords:
      strong: [灌装, 无菌, 卫生级, CIP, SIP, 洁净, 乳品, 乳制品, 饮料, 发酵, 调配, 巴氏]
      mid: [食品, 饮料厂, 罐装, UHT, 乳业, 啤酒, 饮品, 工厂新建, 生产线]
    valve_types: [角座阀, 卫生级隔膜阀, 球阀]
    buyer_role:
      primary: 设备OEM
      secondary: 终端工厂

  - id: lithium_injection
    label: 锂电注液
    industries: [电池制造, 新能源, 锂电]
    keywords:
      strong: [注液, 电解液, 锂电池, 电芯, 注液机, 化成, 分容, 正极材料, 负极材料, 隔膜]
      mid: [动力电池, 储能电池, 极片, 涂布, 电池产线, 锂电, 储能, 电池项目, 新能源电池]
    valve_types: [膜塞阀, 注液阀, 针阀]
    buyer_role:
      primary: 设备OEM
      secondary: 终端工厂

  - id: rubber_curing
    label: 橡塑硫化
    industries: [橡胶和塑料制品业, 轮胎, 橡塑, 印染]
    keywords:
      strong: [硫化, 轮胎, 硫化机, 橡胶, 染色, 定型机]
      mid: [塑胶, 注塑, 印染, 定型, 蒸汽, 橡塑制品]
    valve_types: [角座阀, 蝶阀, 疏水阀]
    buyer_role:
      primary: EPC
      secondary: 终端工厂

  - id: heavy_process
    label: 重过程
    industries: [化工, 化学原料和化学制品制造业, 冶金, 电力]
    keywords:
      strong: [化工, 反应釜, 装置, 储罐, 精馏, 蒸发结晶]
      mid: [管道, 扩建, 技改, 园区, 工艺装置]
    valve_types: [蝶阀, 球阀, 隔膜阀]
    buyer_role:
      primary: EPC
      secondary: 经销商

  - id: pharma_ref
    label: 制药参照
    industries: [医药制造业, 制药, 生物制品]
    keywords:
      strong: [无菌, GMP, 原料药, 注射剂, 生物反应器, 疫苗]
      mid: [制剂, 洁净, 生物药, 冻干, 药业, 生物制品, 化学药品, 中药, 单抗, 细胞]
    valve_types: [卫生级隔膜阀, 角座阀]
    buyer_role:
      primary: 设备OEM
      secondary: EPC
